---
- name: 모니터링 시스템 긴급 재난 복구(DR) 플레이북
  hosts: k8s-monitoring
  become: true
  vars:
    project_id: "{{ project_id }}"
    # playbook 실행 시 무조건 -e "target_date=YYYYMMDD" 를 주입해야함.

  tasks:
    - name: 필수 변수(target_date) 입력 여부 검증
      ansible.builtin.fail:
        msg: "playbook 실행 시 무조건 -e 'target_date=YYYYMMDD' 를 주입해야함."
      when: target_date is not defined

    - name: 기존 프로메테우스 및 그라파나 컨테이너 일시 중지
      community.docker.docker_container:
        name: "{{ item }}"
        state: stopped
      loop:
        - prometheus
        - grafana

    - name: 데이터 유실/오염 방지를 위해 기존 디렉토리 백업 파기 (초기화)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/grafana
        - /var/lib/prometheus

    - name: 깨끗한 상태의 데이터 디렉토리 재생성
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: '0777'
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
      loop:
        - { path: '/var/lib/prometheus' }
        - { path: '/var/lib/grafana', owner: '472', group: '472' }
    
    - name: 임시 임포트 디렉토리 생성
      ansible.builtin.file:
        path: /tmp/recovery
        state: directory
        mode: '0755'

    - name: GCS 버킷에서 백업본 다운로드
      ansible.builtin.shell: |
        gsutil -m cp -r gs://k8s-monitoring-backup-{{ project_id }}/grafana-{{ target_date }}/* /var/lib/grafana/
        gsutil -m cp -r gs://k8s-monitoring-backup-{{ project_id }}/prometheus-{{ target_date }}/* /var/lib/prometheus/
      changed_when: true

    - name: 복원된 데이터 파일들의 권한 소유주 정돈
      ansible.builtin.file:
        path: /var/lib/grafana
        recurse: yes
        owner: '472'
        group: '472'

    - name: 복구 완료된 프로메테우스 및 그라파나 컨테이너 재가동
      community.docker.docker_container:
        name: "{{ item }}"
        state: started
      loop:
        - prometheus
        - grafana

    - name: 리버스 프록시(Nginx) 리스타트
      community.docker.docker_container:
        name: nginx-proxy
        state: restarted