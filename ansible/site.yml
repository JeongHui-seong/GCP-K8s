---
# 모든 노드 공통 설정
- name: k8s 노드 공통 설정
  hosts: k8s_master:monitoring
  become: true
  roles:
    - common

# 마스터 노드 초기화
- name: k8s 마스터 노드 초기화
  hosts: k8s_master
  become: true
  roles:
    - k8s_master

# 네트워크 플러그인 배포
- name: Calico 네트워크 플러그인 배포
  hosts: k8s_master
  become: true
  roles:
    - k8s_network

# 모니터링 VM 설정
- name: 모니터링 VM Prometheus & Grafana 구현
  hosts: monitoring
  become: true
  roles:
    - monitoring

# ArgoCD & Nginx Ingress 설치
- name: ArgoCD & Nginx Ingress 설치 및 설정
  hosts: k8s_master
  become: true
  roles:
    - argocd