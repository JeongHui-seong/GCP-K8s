---
- name: Docker 공식 dnf repo 추가
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'

- name: containerd.io 최신 패키지 설치
  ansible.builtin.dnf:
    name: containerd.io
    state: present

- name: containerd 설정 디렉토리 보장
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: SystemCgroup이 활성화된 표준 config.toml 템플릿 배치
  ansible.builtin.template:
    src: containerd_config.toml.j2
    dest: /etc/containerd/config.toml
    mode: '0644'
  notify: restart containerd

- name: containerd 데몬 시작 및 상시 활성화
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: yes