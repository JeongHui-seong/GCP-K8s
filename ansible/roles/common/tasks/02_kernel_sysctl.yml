---
- name: 쿠버네티스 필수 커널 모듈 설정 파일 생성
  ansible.builtin.template:
    src: k8s_modules.conf.j2
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'
  register: modules_config

- name: 커널 모듈 즉시 로드
  ansible.builtin.command: "modprobe {{ item }}"
  loop: "{{ kernel_modules }}"
  when: modules_config.changed
  changed_when: true

- name: 네트워킹을 위한 sysctl 커널 파라미터 파일 배치
  ansible.builtin.template:
    src: k8s_sysctl.conf.j2
    dest: /etc/sysctl.d/k8s.conf
    mode: '0644'
  register: sysctl_config

- name: sysctl 커널 파라미터 동적 리로드
  ansible.builtin.command: sysctl --system
  when: sysctl_config.changed
  changed_when: true