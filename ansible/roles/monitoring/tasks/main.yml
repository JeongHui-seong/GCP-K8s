---
- name: 도커 의존성 패키지 설치
  ansible.builtin.dnf:
    name: device-mapper-persistent-data, lvm2
    state: present
  
- name: 도커 공식 저장소 등록
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo

- name: Docker CE 및 관련 패키지 설치
  ansible.builtin.dnf:
    name: docker-ce, docker-ce-cli, containerd.io
    state: present

- name: 도커 서비스 활성화 및 시작
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: 프로메테우스 호스트 볼륨 디렉토리 생성
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0777' # 도커 내부 프로메테우스 유저가 쓸 수 있도록 권한 개방
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
  loop:
    - { path: '/etc/prometheus' }
    - { path: '/var/lib/prometheus' }
    # 그라파나 관련 폴더들은 켜지자마자 글을 쓸 수 있게 컨테이너 유저인 472로 소유권을 넘기기
    - { path: '/var/lib/grafana', owner: '472', group: '472' }
    - { path: '/etc/grafana/provisioning/datasources', owner: '472', group: '472' }

- name: 파이썬 pip 패키지 매니저 설치
  ansible.builtin.dnf:
    name: python3-pip
    state: present

- name: 파이썬 도커 제어 라이브러리 설치
  ansible.builtin.pip:
    name:
      - "requests==2.28.1"
      - "docker==6.1.3" # 최신 버전 호환 이슈로 6버전 고정
      - "urllib3<2.0.0" # requests 버전 충돌 이슈로 2.0 미만 제한
    state: present
    executable: pip3

- name: 프로메테우스 데이터 받아올 IP 설정 파일 배치
  ansible.builtin.copy:
    dest: /etc/prometheus/prometheus.yml
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: 'Kubernetes-nodes'
          static_configs:
            - targets:
              - '{{ hostvars['k8s-master']['private_ip'] }}:9100'
              - '{{ hostvars['k8s-worker-1']['private_ip'] }}:9100'
              - '{{ hostvars['k8s-worker-2']['private_ip'] }}:9100'

- name: 그라파나 데이터소스 자동 연동 관리 파일 생성
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/datasources/prometheus-datasource.yml
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true

- name: 프로메테우스와 그라파나 전용 도커 네트워크 생성
  community.docker.docker_network:
    name: monitoring-network
    state: present

- name: 프로메테우스 컨테이너 구동
  community.docker.docker_container:
    name: prometheus
    image: prom/prometheus:v2.53.0
    state: started
    restart_policy: always
    published_ports:
      - "9090:9090"
    networks:
      - name: monitoring-network
    volumes:
      - /etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/lib/prometheus:/prometheus
    # 데이터가 10GB가 넘으면 옛날 데이터부터 삭제하는 command
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=10GB'

- name: 그라파나 컨테이너 구동
  community.docker.docker_container:
    name: grafana
    image: grafana/grafana:11.0.0
    state: started
    restart_policy: always
    published_ports:
      - "3000:3000"
    networks:
      - name: monitoring-network
    volumes:
      - /var/lib/grafana:/var/lib/grafana
      - /etc/grafana/provisioning:/etc/grafana/provisioning

- name: 프로메테우스와 그라파나 데이터를 GCS로 자동 백업 설정
  ansible.builtin.cron:
    name: "gcs monitoring data backup"
    minute: "0"
    hour: "22"
    job: >
      BACKUP_DATE=$(date +\%Y\%m\%d) &&
      sudo gsutil cp -r /var/lib/grafana gs://k8s-monitoring-backup-{{ project_id }}/grafana-${BACKUP_DATE} &&
      sudo gsutil cp -r /var/lib/prometheus gs://k8s-monitoring-backup-{{ project_id }}/prometheus-${BACKUP_DATE}
  become: true

- name: Nginx 및 SSL 설정 파일이 위치할 디렉토리 생성
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/nginx/conf.d
    - /etc/letsencrypt

- name: Let's Encrypt 웹 루트로 쓸 빈 폴더 생성
  ansible.builtin.file:
    path: /var/www/certbot
    state: directory
    mode: '0755'

- name: Nginx 리버스 프록시 설정 파일(Jinja2) 전송
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/monitoring.conf
    content: |
      server {
          listen 80;
          server_name {{ monitor_domain }};

          # 구글 로드밸런서 리버스 프록시 헬스 체크
          location /healthz {
            access_log off;
            return 200 'OK';
          }
          
          # Let's Encrypt 인증서 발급을 위한 챌린지 경로 뚫어두기
          location /.well-known/acme-challenge/ {
              root /var/www/certbot;
          }

          # HTTP로 들어오면 HTTPS로 강제 리다이렉트
          location / {
              return 301 https://$host$request_uri;
          }
      }


- name: 외부 트래픽을 받아줄 Nginx 리버스 프록시 컨테이너 구동
  community.docker.docker_container:
    name: nginx-proxy
    image: nginx:1.25-alpine
    state: started
    restart_policy: always
    published_ports:
      - "80:80"   # HTTP 수신용
      - "443:443" # HTTPS 수신용
    networks:
      - name: monitoring-network # 🌟 프로메테우스/그라파나가 속한 대역에 결합
    volumes:
      - /etc/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

- name: Certbot 도커를 이용해 SSL 무료 인증서 발급 (최초 1회 실행)
  community.docker.docker_container:
    name: certbot
    image: certbot/certbot:v2.11.0
    state: started
    # 도메인 소유권을 확인받기 위해 인증 명령어를 주입합니다.
    command: >
      certonly --webroot -w /var/www/certbot 
      -d {{ monitor_domain }} 
      --email {{ email_address }} 
      --agree-tos --no-eff-email --keep-until-expiring --non-interactive
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    # 발급이 끝나면 컨테이너가 자동으로 멈추도록 설정
    detach: false

- name: 인증서 발급 완료 후 Https용 Nginx 설정 파일 추가 전송
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/monitoring-ssl.conf
    content: |
      server {
          listen 443 ssl;
          server_name {{ monitor_domain }};

          ssl_certificate /etc/letsencrypt/live/{{ monitor_domain }}/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/{{ monitor_domain }}/privkey.pem;

          location / {
              proxy_pass http://grafana:3000; # 도커 네트워크 내부의 그라파나로 토스
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

- name: Nginx 컨테이너에 신규 SSL 설정 무중단 반영 (Reload)
  ansible.builtin.shell: |
    docker exec nginx-proxy nginx -s reload
  changed_when: true

- name: Certbot SSL 인증서 자동 갱신(Renew) 크론탭 등록
  ansible.builtin.cron:
    name: "renew let's encrypt ssl certificate for docker"
    day: "1" # 매달 1일 새벽에 만료일 검사 후 자동 갱신 및 Nginx 재부팅
    hour: "03"
    minute: "0"
    job: >
      docker run --rm -v /etc/letsencrypt:/etc/letsencrypt -v /var/www/certbot:/var/www/certbot certbot/certbot renew &&
      docker exec nginx-proxy nginx -s reload